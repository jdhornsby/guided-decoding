[project]
name = "guided-decoding"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.0",
    "chess>=1.11",
    "numpy>=2.5.2",
    "torch>=2.14.0",
    "transformers>=5.16.1",
    "bitsandbytes>=0.48; sys_platform == 'linux'",
    "torchao>=0.14; sys_platform == 'linux'",
]

[project.scripts]
guided-decoding = "guided_decoding.run:main"
guided-decoding-chess = "guided_decoding.play:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = []
